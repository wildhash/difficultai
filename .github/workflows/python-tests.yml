name: Python and voice SDK tests

on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'Makefile'
      - 'Dockerfile'
      - '.dockerignore'
      - 'compose.owner-pilot.yml'
      - 'scripts/verify-worker-image.sh'
      - '.github/workflows/python-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'Makefile'
      - 'Dockerfile'
      - '.dockerignore'
      - 'compose.owner-pilot.yml'
      - 'scripts/verify-worker-image.sh'
      - '.github/workflows/python-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPIK_DISABLED: '1'
      PYTHON_DOTENV_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned dependencies
        run: pip install -r requirements.txt
      - name: Run unit and credential-free voice runtime tests
        run: python -m unittest discover -p 'test_*.py' -v
      - name: Verify worker CLI imports
        run: python -m apps.livekit_agent --help
      - name: Run offline preflight
        run: python -m apps.livekit_agent.smoke_test --offline
      - name: Preserve offline preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-preflight-${{ github.sha }}
          path: scorecards/preflight/*.json
          if-no-files-found: ignore

  worker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify replacement-volume contract
        run: scripts/verify-worker-image.sh "difficultai-owner-pilot:${{ github.sha }}"
